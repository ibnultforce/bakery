<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Laminated dough with butter layers and a rolling pin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e3d8"/><stop offset="1" stop-color="#cfc6b6"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a46e"/><stop offset="1" stop-color="#8f5a2c"/></linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g fill="#fff" opacity=".5"><circle cx="160" cy="120" r="3"/><circle cx="260" cy="480" r="4"/><circle cx="1000" cy="520" r="3"/><circle cx="1080" cy="140" r="4"/><circle cx="700" cy="90" r="3"/></g>
  <!-- dough block cross-section -->
  <g transform="translate(240 200)">
    <rect x="0" y="0" width="520" height="220" rx="24" fill="#f4dfb6"/>
    <g fill="#fbe58a" opacity=".9">
      <rect x="20" y="24" width="480" height="14" rx="7"/><rect x="20" y="62" width="480" height="14" rx="7"/>
      <rect x="20" y="100" width="480" height="14" rx="7"/><rect x="20" y="138" width="480" height="14" rx="7"/>
      <rect x="20" y="176" width="480" height="14" rx="7"/>
    </g>
  </g>
  <!-- butter block -->
  <g transform="translate(820 360)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#fbe07a"/>
    <rect x="0" y="0" width="160" height="22" rx="8" fill="#fdeca8"/>
  </g>
  <!-- rolling pin -->
  <g transform="rotate(-10 600 130)">
    <rect x="260" y="100" width="680" height="60" rx="30" fill="url(#pin)"/>
    <rect x="200" y="116" width="80" height="28" rx="14" fill="#7a4a24"/>
    <rect x="920" y="116" width="80" height="28" rx="14" fill="#7a4a24"/>
  </g>
  <!-- flour dust -->
  <g fill="#fbf8f2" opacity=".85"><ellipse cx="300" cy="460" rx="120" ry="14"/><ellipse cx="900" cy="470" rx="140" ry="12"/></g>
</svg>
