  <ellipse cx="400" cy="230" rx="200" ry="36" fill="#5c2f16"/>
  <!-- drip -->
  <path d="M200 232 v30 q10 22 20 0 v-10 q12 40 24 0 v-6 q10 28 22 0 q14 50 26 0 q12 20 24 0 v-6 q12 36 24 0 q12 24 24 0 q14 44 26 0 q10 18 22 0 q12 34 24 0 q12 22 24 0 q14 48 26 0 q10 20 22 0 q12 30 24 0 q10 20 22 0 v-30z" fill="#2e150a"/>
