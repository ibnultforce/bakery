  <!-- berries -->
  <g><circle cx="330" cy="212" r="20" fill="#c2283b"/><circle cx="380" cy="200" r="22" fill="#d6334a"/><circle cx="430" cy="208" r="18" fill="#3b3f8f"/><circle cx="470" cy="215" r="20" fill="#c2283b"/><circle cx="405" cy="185" r="14" fill="#3b3f8f"/></g>
  <g fill="#fff" opacity=".6"><circle cx="374" cy="192" r="5"/><circle cx="324" cy="205" r="4"/><circle cx="464" cy="207" r="4"/></g>
