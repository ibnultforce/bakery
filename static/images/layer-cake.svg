<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Chocolate layer cake with berries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe4e0"/><stop offset="1" stop-color="#eec0b6"/></linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a2512"/><stop offset=".5" stop-color="#6e3a1c"/><stop offset="1" stop-color="#3d1d0d"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- stand -->
  <rect x="385" y="470" width="30" height="70" fill="#d9d2c8"/>
  <ellipse cx="400" cy="540" rx="110" ry="16" fill="#e8e2d8"/>
  <ellipse cx="400" cy="470" rx="250" ry="30" fill="#f4f0ea"/>
